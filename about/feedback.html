<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Submit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Container Card */
        .feedback-card {
            background-color: #111111;
            border: 1px solid #222222;
            max-width: 650px;
            width: 100%;
            padding: 40px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 8px;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1rem;
            color: #888888;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Form Grouping */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.95rem;
            color: #aaaaaa;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            background-color: #1a1a1a;
            border: 1px solid #333333;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #ffffff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            padding: 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #cccccc;
        }
    </style>
</head>
<body>

    <div class="feedback-card">
        <h1 class="title">Feedback</h1>
        <div class="subtitle">We value your thoughts</div>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="category">Feedback Type</label>
                <select id="category" name="category">
                    <option value="general">General Feedback</option>
                    <option value="suggestion">Feature Suggestion</option>
                    <option value="bug">Report an Issue</option>
                    <option value="movie">Suggest a Movie Page</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message" placeholder="Write your feedback or submission here..." required></textarea>
            </div>

            <a href="./submit.html"><button type="button" class="btn-submit">Submit Feedback</button></a>
        </form>
    </div>

</body>
</html>
